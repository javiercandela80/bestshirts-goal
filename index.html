
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestshirts.goal</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px 15px;
      background: #050505;
      border-bottom: 1px solid #333;
    }

    h1 { margin: 0; font-size: 32px; }
    h2 { margin-top: 25px; }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 15px;
    }

    .card {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px 12px;
    }

    button, .instagram-link {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    button:hover, .instagram-link:hover {
      background: #ddd;
    }

    .instagram-link {
      max-width: 230px;
      margin: 15px auto 0;
      background: #d62976;
      color: white;
    }

    .back {
      max-width: 200px;
      margin: 20px auto;
      background: #333;
      color: white;
    }

    .hidden { display: none; }

    .shirt {
      font-size: 65px;
      margin: 15px;
    }

    .shirt-image {
      width: 100%;
      max-width: 220px;
      height: 220px;
      object-fit: contain;
      display: block;
      margin: 15px auto;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
    }

    footer {
      padding: 25px;
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Bestshirts.goal</h1>
    <p>Football shirts for every fan</p>
    <a
      class="instagram-link"
      href="https://www.instagram.com/bestshirts_goal/"
      target="_blank"
      rel="noopener noreferrer"
    >Síguenos en Instagram</a>
  </header>

  <main class="container">
    <section id="home">
      <h2>Choose your version</h2>
      <div class="grid">
        <div class="card">
          <h3>Fan Version</h3>
          <p class="price">20 €</p>
          <button onclick="chooseVersion('Fan Version', 20)">Explore</button>
        </div>

        <div class="card">
          <h3>Player Version</h3>
          <p class="price">25 €</p>
          <button onclick="chooseVersion('Player Version', 25)">Explore</button>
        </div>

        <div class="card">
          <h3>Vintage</h3>
          <p class="price">26 €</p>
          <button onclick="chooseVersion('Vintage', 26)">Explore</button>
        </div>
      </div>
    </section>

    <section id="leaguesPage" class="hidden">
      <button class="back" onclick="showPage('home')">← Back</button>
      <h2 id="versionTitle">Choose a league</h2>
      <div id="leaguesList" class="grid"></div>
    </section>

    <section id="teamsPage" class="hidden">
      <button class="back" onclick="showPage('leaguesPage')">← Back to leagues</button>
      <h2 id="leagueTitle">Choose a team</h2>
      <div id="teamsList" class="grid"></div>
    </section>

    <section id="shirtsPage" class="hidden">
      <button class="back" onclick="showPage('teamsPage')">← Back to teams</button>
      <h2 id="teamTitle"></h2>
      <p id="selectedVersion"></p>
      <div id="shirtsList" class="grid"></div>
    </section>
  </main>

  <footer>
    Bestshirts.goal · Football shirts catalogue
  </footer>

  <script>
    const leagues = {
      "LaLiga": [
        "Real Madrid", "FC Barcelona", "Atlético de Madrid",
        "Athletic Club", "Real Sociedad", "Valencia CF",
        "Levante UD", "Villarreal CF", "Sevilla FC",
        "Real Betis", "Girona FC", "Getafe CF",
        "CA Osasuna", "Rayo Vallecano", "RCD Espanyol",
        "Celta de Vigo", "Deportivo Alavés", "RCD Mallorca",
        "Elche CF", "Real Oviedo"
      ],

      "Premier League": [
        "Arsenal", "Liverpool", "Manchester City",
        "Manchester United", "Chelsea", "Tottenham Hotspur",
        "Newcastle United", "Aston Villa", "Everton",
        "West Ham United", "Brighton", "Crystal Palace",
        "Fulham", "Brentford", "Wolverhampton Wanderers",
        "Nottingham Forest", "AFC Bournemouth", "Sunderland",
        "Leeds United", "Burnley"
      ],

      "Liga Portugal": [
        "SL Benfica", "FC Porto", "Sporting CP",
        "SC Braga", "Vitória SC", "Boavista FC", "Famalicão"
      ],

      "Ligue 1": [
        "Paris Saint-Germain", "Olympique de Marseille",
        "Olympique Lyonnais", "AS Monaco", "LOSC Lille",
        "OGC Nice", "RC Lens", "Stade Rennais",
        "RC Strasbourg", "Toulouse FC", "Montpellier",
        "FC Nantes", "Stade de Reims", "AJ Auxerre",
        "Le Havre AC", "Angers SCO", "FC Lorient", "FC Metz"
      ],

      "Serie A": [
        "Inter", "AC Milan", "Juventus", "Napoli",
        "AS Roma", "Lazio", "Atalanta", "Fiorentina",
        "Bologna", "Torino", "Genoa", "Udinese",
        "Cagliari", "Parma", "Lecce", "Como",
        "Hellas Verona", "Sassuolo", "Pisa", "Cremonese"
      ],

      "Bundesliga": [
        "Bayern München", "Borussia Dortmund",
        "Bayer Leverkusen", "RB Leipzig",
        "Eintracht Frankfurt", "VfB Stuttgart",
        "Werder Bremen", "Borussia Mönchengladbach",
        "VfL Wolfsburg", "SC Freiburg", "TSG Hoffenheim",
        "Mainz 05", "FC Augsburg", "Union Berlin",
        "FC Köln", "Hamburger SV", "Heidenheim", "St. Pauli"
      ]
    };

    const modelos = ["Local", "Visitante", "Tercera"];

    const camisetasLaLiga = {
      "Real Madrid": modelos,
      "FC Barcelona": modelos,
      "Atlético de Madrid": modelos,
      "Athletic Club": modelos,
      "Real Sociedad": modelos,
      "Valencia CF": modelos,
      "Levante UD": modelos,
      "Villarreal CF": modelos,
      "Sevilla FC": modelos,
      "Real Betis": modelos,
      "Girona FC": modelos,
      "Getafe CF": modelos,
      "CA Osasuna": modelos,
      "Rayo Vallecano": modelos,
      "RCD Espanyol": modelos,
      "Celta de Vigo": modelos,
      "Deportivo Alavés": modelos,
      "RCD Mallorca": modelos,
      "Elche CF": modelos,
      "Real Oviedo": modelos
    };

    let selectedVersion = "";
    let selectedPrice = 0;
    let selectedLeague = "";
    let selectedTeam = "";

    function showPage(pageId) {
      document.querySelectorAll("main section").forEach(section => {
        section.classList.add("hidden");
      });

      document.getElementById(pageId).classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function chooseVersion(version, price) {
      selectedVersion = version;
      selectedPrice = price;

      document.getElementById("versionTitle").textContent =
        version + " — Choose a league";

      const list = document.getElementById("leaguesList");
      list.innerHTML = "";

      Object.keys(leagues).forEach(league => {
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h3");
        title.textContent = league;

        const button = document.createElement("button");
        button.textContent = "See teams";
        button.onclick = () => chooseLeague(league);

        card.appendChild(title);
        card.appendChild(button);
        list.appendChild(card);
      });

      showPage("leaguesPage");
    }

    function chooseLeague(league) {
      selectedLeague = league;
      document.getElementById("leagueTitle").textContent = league;

      const list = document.getElementById("teamsList");
      list.innerHTML = "";

      leagues[league].forEach(team => {
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h3");
        title.textContent = team;

        const button = document.createElement("button");
        button.textContent = "See shirts";
        button.onclick = () => chooseTeam(team);

        card.appendChild(title);
        card.appendChild(button);
        list.appendChild(card);
      });

      showPage("teamsPage");
    }

    function chooseTeam(team) {
      selectedTeam = team;

      document.getElementById("teamTitle").textContent = team;
      document.getElementById("selectedVersion").textContent =
        selectedVersion + " · " + selectedPrice + " €";

      const list = document.getElementById("shirtsList");
      list.innerHTML = "";

      let models = modelos;

      if (selectedLeague === "LaLiga" && camisetasLaLiga[team]) {
        models = camisetasLaLiga[team];
      }

      models.forEach(model => {
        const card = document.createElement("div");
        card.className = "card";

        const isMadridHomeFan =
          selectedLeague === "LaLiga" &&
          selectedVersion === "Fan Version" &&
          team === "Real Madrid" &&
          model === "Local";

        if (isMadridHomeFan) {
          const img = document.createElement("img");
          img.src = "./images/madrid%20fan%201era.avif";
          img.alt = "Camiseta local del Real Madrid, versión Fan";
          img.className = "shirt-image";

          img.onerror = function () {
            this.remove();
            const fallback = document.createElement("div");
            fallback.className = "shirt";
            fallback.textContent = "👕";
            card.prepend(fallback);
          };

          card.appendChild(img);
        } else {
          const shirt = document.createElement("div");
          shirt.className = "shirt";
          shirt.textContent = "👕";
          card.appendChild(shirt);
        }

        const title = document.createElement("h3");
        title.textContent = team + " — " + model;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = selectedPrice + " €";

        const note = document.createElement("p");
        note.textContent = isMadridHomeFan
          ? "Primera equipación · Fan Version"
          : "Foto pendiente de añadir";

        card.appendChild(title);
        card.appendChild(price);
        card.appendChild(note);
        list.appendChild(card);
      });

      showPage("shirtsPage");
    }
  </script>
</body>
</html>
